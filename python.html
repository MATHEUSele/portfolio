<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Stack - Demonstração Interativa</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: 'Inter Tight', sans-serif;
            background-color: #0b1120;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, #090d16 0%, #0f172a 50%, #0b132b 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }
        .overlay {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            min-height: 100vh;
            padding: 45px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 880px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .title-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        h1 { 
            margin: 0; 
            font-size: 2.3rem; 
            background: linear-gradient(to right, #60a5fa, #3b82f6, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.35);
        }
        .back-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: translateX(-5px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .back-btn svg {
            margin-right: 8px;
        }

        /* Janela Principal Clean */
        .chat-window {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(59, 130, 246, 0.28);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.1);
            display: flex;
            flex-direction: column;
            min-height: 540px;
            overflow: hidden;
        }

        .chat-topbar {
            background: rgba(9, 13, 22, 0.88);
            padding: 14px 22px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.16);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .window-dots {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dot.red { background: #ef4444; }
        .dot.yellow { background: #f59e0b; }
        .dot.green { background: #22c55e; }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #93c5fd;
        }
        .status-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .chat-body {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .fade-in {
            animation: fadeIn 0.28s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Menu Clean */
        .menu-intro {
            margin-bottom: 24px;
        }
        .menu-intro h2 {
            margin: 0 0 8px 0;
            font-size: 1.45rem;
            font-weight: 600;
            color: #f8fafc;
        }
        .menu-intro p {
            margin: 0;
            font-size: 0.98rem;
            color: #94a3b8;
        }

        .clean-menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .clean-menu-item {
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(59, 130, 246, 0.22);
            border-radius: 12px;
            padding: 16px 20px;
            color: #f8fafc;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.22s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }
        .clean-menu-item:hover {
            background: rgba(37, 99, 235, 0.18);
            border-color: #60a5fa;
            transform: translateX(4px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.18);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .item-badge {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .item-title {
            font-size: 1.02rem;
            font-weight: 600;
            color: #e2e8f0;
        }
        .item-arrow {
            color: #60a5fa;
            opacity: 0.6;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }
        .clean-menu-item:hover .item-arrow {
            transform: translateX(4px);
            opacity: 1;
        }

        /* Visualização da Resposta */
        .topic-view {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .topic-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .return-menu-btn {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.32);
            color: #93c5fd;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .return-menu-btn:hover {
            background: rgba(59, 130, 246, 0.25);
            color: #fff;
            transform: translateX(-3px);
        }

        .topic-card {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 14px;
            padding: 24px;
        }
        .topic-card h3 {
            margin: 0 0 12px 0;
            font-size: 1.3rem;
            color: #93c5fd;
        }
        .topic-card p {
            margin: 0 0 16px 0;
            color: #e2e8f0;
            line-height: 1.65;
            font-size: 0.98rem;
        }
        .topic-card ul {
            margin: 0 0 18px 18px;
            padding: 0;
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 0.94rem;
        }
        .topic-card li {
            margin-bottom: 6px;
        }

        /* Bloco de Código */
        .code-wrapper {
            background: #090d16;
            border: 1px solid rgba(59, 130, 246, 0.28);
            border-radius: 10px;
            overflow: hidden;
        }
        .code-header {
            background: rgba(15, 23, 42, 0.95);
            padding: 9px 14px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.18);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: #60a5fa;
        }
        .copy-code-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-code-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            color: white;
        }
        pre {
            margin: 0;
            padding: 16px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.84rem;
            line-height: 1.55;
            color: #dbeafe;
        }

        /* Indicador de Carregamento Rápido */
        .loading-box {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #93c5fd;
        }
        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin: 0 2px;
            background: #60a5fa;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        @media (max-width: 768px) {
            body, html {
                background-attachment: scroll;
            }
            .overlay {
                padding: 24px 14px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .chat-body {
                padding: 20px 16px;
            }
            .clean-menu-item {
                padding: 14px 16px;
            }
            .item-title {
                font-size: 0.95rem;
            }
            .topic-card {
                padding: 18px 16px;
            }
        }
    </style>
</head>

    <script>
        const chatBody = document.getElementById('chatBody');

        const menuData = {
            rag: {
                num: "01",
                menuTitle: "Arquitetura RAG & LangChain",
                title: "Arquitetura RAG & LangChain (LLMOps)",
                text: "Desenvolvimento de pipelines de <strong>Retrieval-Augmented Generation (RAG)</strong> em Python para que LLMs respondam com precisão sobre documentos e bases privadas, evitando alucinações.",
                bullets: [
                    "<strong>Ingestão & Chunking:</strong> Processamento de PDFs e dados com <code>RecursiveCharacterTextSplitter</code>.",
                    "<strong>Vector Search:</strong> Indexação semântica com embeddings para recuperação de contexto relevante.",
                    "<strong>Orquestração:</strong> Cadeias modulares integrando <code>LangChain</code> e Google Gemini / OpenAI."
                ],
                fileName: "rag_pipeline.py",
                code: `from langchain_google_genai import ChatGoogleGenerativeAI, GoogleGenerativeAIEmbeddings
from langchain_community.vectorstores import FAISS
from langchain.chains import create_retrieval_chain
from langchain.chains.combine_documents import create_stuff_documents_chain
from langchain_core.prompts import ChatPromptTemplate

def build_rag_agent(docs):
    embeddings = GoogleGenerativeAIEmbeddings(model="models/embedding-001")
    vectorstore = FAISS.from_documents(docs, embeddings)
    retriever = vectorstore.as_retriever(search_kwargs={"k": 4})

    llm = ChatGoogleGenerativeAI(model="gemini-2.5-flash", temperature=0.2)
    prompt = ChatPromptTemplate.from_messages([
        ("system", "Responda com base exclusivamente no contexto:\\n\\n{context}"),
        ("human", "{input}")
    ])

    return create_retrieval_chain(retriever, create_stuff_documents_chain(llm, prompt))`
            },
            fastapi: {
                num: "02",
                menuTitle: "APIs em Tempo Real (FastAPI + WebSockets)",
                title: "Backend Assíncrono com FastAPI & WebSockets",
                text: "Construção de APIs de baixa latência com <strong>FastAPI</strong> e <code>asyncio</code>. Aplicado no <strong>Artemis 2.0</strong> para comunicação bidirecional em tempo real entre o frontend React e o modelo de IA.",
                bullets: [
                    "<strong>Streaming via WebSockets:</strong> Entrega de respostas token a token em tempo real.",
                    "<strong>Tipagem Forte:</strong> Validação de payloads e schemas com <code>Pydantic</code>.",
                    "<strong>Performance Assíncrona:</strong> Execução não-bloqueante para múltiplas conexões simultâneas."
                ],
                fileName: "artemis_ws_server.py",
                code: `from fastapi import FastAPI, WebSocket, WebSocketDisconnect

app = FastAPI(title="Artemis 2.0 - Realtime AI")

@app.websocket("/ws/chat")
async def websocket_assistant(ws: WebSocket):
    await ws.accept()
    try:
        while True:
            query = await ws.receive_text()
            async for token in stream_gemini_response(query):
                await ws.send_json({"type": "stream", "content": token})
            await ws.send_json({"type": "done"})
    except WebSocketDisconnect:
        print("Conexão encerrada.")`
            },
            automation: {
                num: "03",
                menuTitle: "Automação Inteligente (Python + n8n)",
                title: "Integração Python + Fluxos n8n",
                text: "Combinação da orquestração visual do <strong>n8n</strong> com scripts <strong>Python</strong> dedicados ao processamento pesado de dados, regras de negócio e agentes autônomos.",
                bullets: [
                    "<strong>Workers via Webhook:</strong> Serviços Python que processam dados do n8n e retornam JSON estruturado.",
                    "<strong>Automação Ponta a Ponta:</strong> Integração com WhatsApp, bancos de dados, e-mails e APIs REST.",
                    "<strong>Certificação 77.5h:</strong> Formação completa em Automação com IA e n8n."
                ],
                fileName: "n8n_webhook_worker.py",
                code: `import httpx
import pandas as pd

async def process_and_notify_n8n(raw_records: list[dict], webhook_url: str):
    df = pd.DataFrame(raw_records)
    summary = (
        df.groupby("categoria")["valor"]
        .agg(total="sum", media="mean")
        .reset_index()
        .to_dict(orient="records")
    )

    async with httpx.AsyncClient(timeout=15.0) as client:
        response = await client.post(webhook_url, json={"status": "ok", "metrics": summary})
        return response.json()`
            },
            data: {
                num: "04",
                menuTitle: "Engenharia de Dados, Docker & SQL",
                title: "Pipelines de Dados, Docker & MySQL",
                text: "Desenvolvimento de rotinas de extração e transformação de dados (ETL) com Python, persistência relacional em <strong>MySQL</strong> e padronização de ambientes com <strong>Docker</strong>.",
                bullets: [
                    "<strong>ETL & Análise:</strong> Manipulação, limpeza e estruturação de dados com Python.",
                    "<strong>Banco de Dados SQL:</strong> Consultas parametrizadas e integração segura via <code>SQLAlchemy</code>.",
                    "<strong>Containers Docker:</strong> Empacotamento de serviços garantindo portabilidade e deploy limpo."
                ],
                fileName: "database_pipeline.py",
                code: `from sqlalchemy import create_engine, text
import os

ENGINE = create_engine(os.getenv("DATABASE_URL", "mysql+pymysql://user:pass@db:3306/app"))

def fetch_active_metrics(limit: int = 50) -> list[dict]:
    query = text("""
        SELECT u.nome, COUNT(i.id) AS interacoes
        FROM usuarios u
        INNER JOIN interacoes_ia i ON i.usuario_id = u.id
        WHERE u.ativo = 1
        GROUP BY u.id, u.nome
        ORDER BY interacoes DESC
        LIMIT :limit
    """)
    with ENGINE.connect() as conn:
        return [dict(r._mapping) for r in conn.execute(query, {"limit": limit})]`
            },
            experience: {
                num: "05",
                menuTitle: "Experiência Prática (Petrobras & UFPB)",
                title: "Aplicação Real: Petrobras, UFPB & Projetos",
                text: "União da base acadêmica em <strong>Sistemas de Informação (UFPB)</strong> com a atuação corporativa na <strong>Petrobras</strong>, criando soluções escaláveis de automação e IA.",
                bullets: [

                code: `profile = {

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function renderMenu() {
            const itemsHtml = Object.entries(menuData).map(([key, item]) => `
                <button class="clean-menu-item" onclick="selectTopic('${key}')">
                    <div class="item-left">
                        <span class="item-badge">${item.num}</span>
                        <span class="item-title">${item.menuTitle}</span>
                    </div>
                    <svg class="item-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            `).join('');

            chatBody.innerHTML = `
                <div class="fade-in">
                    <div class="menu-intro">
                        <h2>Explore minha Stack em Python</h2>
                        <p>Selecione uma área abaixo para visualizar a arquitetura e um exemplo prático de código:</p>
                    </div>
                    <div class="clean-menu-list">
                        ${itemsHtml}
                    </div>
                </div>
            `;
        }

        function selectTopic(key) {
            const item = menuData[key];
            if (!item) return;

            chatBody.innerHTML = `
                <div class="loading-box fade-in">
                    <span>Carregando ${item.fileName}</span>
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                </div>
            `;

            setTimeout(() => {
                const bulletsHtml = item.bullets.map(b => `<li>${b}</li>`).join('');

                chatBody.innerHTML = `
                    <div class="topic-view fade-in">
                        <div class="topic-nav">
                            <button class="return-menu-btn" onclick="renderMenu()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="19" y1="12" x2="5" y2="12"></line>
                                    <polyline points="12 19 5 12 12 5"></polyline>
                                </svg>
                                Voltar ao Menu
                            </button>
                        </div>

                        <div class="topic-card">
                            <h3>${item.title}</h3>
                            <p>${item.text}</p>
                            <ul>${bulletsHtml}</ul>

                            <div class="code-wrapper">
                                <div class="code-header">
                                    <span>${item.fileName}</span>
                                    <button class="copy-code-btn" onclick="copyCode(this)">Copiar Código</button>
                                </div>
                                <pre><code>${escapeHtml(item.code)}</code></pre>
                            </div>
                        </div>
                    </div>
                `;
            }, 300);
        }

        function copyCode(btn) {
            const pre = btn.closest('.code-wrapper').querySelector('pre');
            navigator.clipboard.writeText(pre.innerText).then(() => {
                const original = btn.innerText;
                btn.innerText = "Copiado ✓";
                setTimeout(() => { btn.innerText = original; }, 1600);
            });
        }

        window.addEventListener('DOMContentLoaded', renderMenu);
    </script>
</body>
</html>
