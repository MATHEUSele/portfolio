<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Matheus E. L. Eleoterio — Portfólio Interativo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="52%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26282e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#16171b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Brilhos decorativos na paleta do portfólio -->
  <circle cx="1040" cy="60" r="190" fill="#fbbf24" fill-opacity="0.09"/>
  <circle cx="155" cy="250" r="165" fill="#a3e635" fill-opacity="0.11"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#a3e635" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Emblema à esquerda (monograma M. estilizado) -->
  <rect x="76" y="72" width="156" height="156" rx="28" fill="url(#cardGrad)" stroke="#a3e635" stroke-opacity="0.45" stroke-width="1.8"/>
  <path d="M110 184 L110 116 L146 156 L182 116 L182 184" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="196" cy="180" r="8.5" fill="#a3e635"/>
  <rect x="110" y="198" width="60" height="5" rx="2.5" fill="#fbbf24"/>

  <!-- Título e subtítulo -->
  <text x="270" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">Matheus E. L. Eleoterio</text>
  <text x="272" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="url(#accentGrad)">Portfólio Interativo • IA, Backend &amp; Automação</text>

  <!-- Pills / tags (larguras ajustadas ao texto) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600">
    <rect x="270" y="200" width="178" height="32" rx="16" fill="#1e1e1e" stroke="#a3e635" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="359" y="220.5" text-anchor="middle" fill="#a3e635">HTML5 / CSS3 / JS</text>

    <rect x="460" y="200" width="146" height="32" rx="16" fill="#1e1e1e" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="533" y="220.5" text-anchor="middle" fill="#fbbf24">i18n PT • EN</text>

    <rect x="618" y="200" width="186" height="32" rx="16" fill="#1e1e1e" stroke="#f8fafc" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="711" y="220.5" text-anchor="middle" fill="#f8fafc">GitHub Pages CI/CD</text>
  </g>
</svg>
